name: Run k6 Browser Test

on:
  push:
  pull_request:

jobs:
  k6-browser-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run k6 browser test using Docker
        uses: grafana/run-k6-action@v0.5.0
        with:
          path: scripts/load-test.is # Hoặc đường dẫn file load-test của ông
          flags: --no-usage-report
        env:
          K6_BROWSER_ENABLED: "true"