name: Run k6 Browser Test

on:
  push:
  pull_request:

jobs:
  k6-browser-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run k6 via Docker
        run: |
          docker run --rm -i \
            -v ${{ github.workspace }}:/app \
            -w /app \
            grafana/k6:latest \
            run scripts/load-test.js